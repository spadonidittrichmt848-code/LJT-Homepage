name: Temporary build check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Smoke test output
        run: |
          echo "--- home ---"
          cat _site/index.html | head -c 2000
          echo
          echo "--- publications ---"
          cat _site/publications/index.html | sed -e 's/<[^>]*>//g' | grep -v '^\s*$' | head -c 4000
          echo
          echo "--- cv ---"
          cat _site/cv/index.html | sed -e 's/<[^>]*>//g' | grep -v '^\s*$' | head -c 3000
          echo
          echo "--- generated publication pages ---"
          ls _site/publication/

name: Temporary build check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Check for leftover template demo content
        run: |
          set +e
          grep -rInE "Paper Title|Your Name|Sidebar Name|none@example|Red Brick|GitHub University|Download Paper|Talk 1" _site/ | grep -v "_sass\|node_modules" | head -40
          if [ $? -eq 0 ]; then echo "LEFTOVERS_FOUND"; fi
          echo "grep-exit-checked"
      - name: Dump home page text
        run: |
          sed 's/<[^>]*>/ /g' _site/index.html | tr -s ' ' ' ' | tr '\n' ' ' | head -c 6000
          echo
      - name: Dump publications page text
        run: |
          sed 's/<[^>]*>/ /g' _site/publications/index.html | tr -s ' ' ' ' | tr '\n' ' ' | head -c 4000
          echo
